name: build-android

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Instalar NDK fixado
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Ferramentas nativas
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config nasm yasm cmake ninja-build meson autopoint texinfo
      - name: Build Android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android
          path: |
            dist/gravae-ffmpeg-android-*.tar.gz
            dist/gravae-ffmpeg-sources-*.tar.gz
          if-no-files-found: error
          retention-days: 14
