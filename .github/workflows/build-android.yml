name: build-android

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar NDK fixado
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
      - name: Ferramentas nativas
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config nasm yasm cmake ninja-build meson autopoint texinfo
      - name: Build Android
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          ./scripts/build-android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-android
          path: |
            dist/gravae-ffmpeg-android-*.tar.gz
            dist/gravae-ffmpeg-sources-*.tar.gz
          if-no-files-found: error
          retention-days: 14
