name: build-ios

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Ferramentas nativas
        run: brew install autoconf automake libtool pkg-config nasm gperf texinfo yasm bison autogen wget meson ninja ragel
      - name: Build iOS
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          ./scripts/build-ios.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-ios
          path: dist/gravae-ffmpeg-ios-*.tar.gz
          if-no-files-found: error
          retention-days: 14
